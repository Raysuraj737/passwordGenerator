<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password_Generator</title>
    <link rel="stylesheet" href="password_generator.css">
</head>
<body>
    <div class="main">
        <div class="text">
            <h1>Generate a</h1><br>
            <h2>random password</h2><br>
            <p>Never use an insecure password again.</p>
            <button id="btn" onclick="password_generator()">Generate Passwords</button>
            <button id="saved" onclick="savedPassword()">Saved Password</button>
            <div class="password">
                <button id="pass1-el" onclick="textCopy1()"></button>
                <button id="pass2-el" onclick="textCopy2()"></button>
            </div>
            <p class="text-msg"></p>
        </div>
    </div>
    <script src="password_generator.js"></script>
</body>
</html>
